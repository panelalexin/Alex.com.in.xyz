<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESERVICE | WhatsApp Order</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;color:#fff;overflow:hidden}

/* overlay popup */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  display:flex;align-items:center;justify-content:center;
  z-index:9999
}
.popup{
  background:#fff;color:#333;padding:28px;border-radius:22px;
  width:90%;max-width:380px;text-align:center;
  animation:pop .5s ease
}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.popup button{
  margin-top:15px;width:100%;padding:12px;border:none;border-radius:14px;
  background:linear-gradient(90deg,#ff512f,#f09819);color:#fff;font-weight:600
}

/* steps */
.step{display:none;align-items:center;justify-content:center;height:100vh;animation:slide .5s ease}
.step.active{display:flex}
@keyframes slide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* card */
.card{
  background:#fff;color:#333;width:90%;max-width:420px;
  padding:30px;border-radius:24px;text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,.35);position:relative
}
.back{
  position:absolute;top:15px;left:15px;width:36px;height:36px;
  border-radius:50%;background:linear-gradient(135deg,#ff9f43,#ff6b6b);
  color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer
}

button,select,input{
  width:100%;padding:14px;margin-top:12px;
  border:none;border-radius:14px;font-size:16px
}
.main{background:linear-gradient(90deg,#ff512f,#f09819);color:#fff;font-weight:600}
.service{background:linear-gradient(90deg,#36d1dc,#5b86e5);color:#fff;font-weight:600}
.whatsapp{background:linear-gradient(90deg,#25d366,#128c7e);color:#fff;font-weight:700}
.reset{background:linear-gradient(90deg,#636e72,#2d3436);color:#fff}

footer{
  position:fixed;bottom:0;width:100%;
  background:linear-gradient(90deg,#141e30,#243b55);
  padding:14px;text-align:center;font-size:14px
}
</style>
</head>

<body>

<!-- overlay popup -->
<div class="overlay" id="startPopup">
  <div class="popup">
    <h3>🚀 Website Developed</h3>
    <p><b>Alex Team</b><br>100% Trusted Platform</p>
    <button onclick="closePopup()">Continue</button>
  </div>
</div>

<!-- step 1 -->
<div class="step active" id="s1">
  <div class="card">
    <h2>Welcome to ESERVICE</h2>
    <p>Secure WhatsApp Ordering</p>
    <button class="main" onclick="go(2)">Select Service</button>
  </div>
</div>

<!-- step 2 -->
<div class="step" id="s2">
  <div class="card">
    <div class="back" onclick="back()">⬅</div>
    <h3>Select Service</h3>
    <button class="service" onclick="selectService('Instagram Boost')">Instagram Boost</button>
    <button class="service" onclick="selectService('Instagram Recovery')">Instagram Recovery – ₹300</button>
    <button class="service" onclick="selectService('Instagram Disable')">Instagram Disable – ₹700</button>
    <button class="service" onclick="selectService('YouTube Subscriber')">YouTube Subscriber – ₹50</button>
  </div>
</div>

<!-- step 3 -->
<div class="step" id="s3">
  <div class="card">
    <div class="back" onclick="back()">⬅</div>
    <h3 id="title"></h3>
    <select id="qty"></select>
    <input id="instaUser" placeholder="Enter Instagram Username">
    <input id="ytLink" placeholder="Enter YouTube Channel Link">
    <button class="main" onclick="go(4)">Next</button>
  </div>
</div>

<!-- step 4 -->
<div class="step" id="s4">
  <div class="card">
    <div class="back" onclick="back()">⬅</div>
    <h3>Continue on WhatsApp</h3>
    <button class="whatsapp" onclick="orderWA()">Proceed</button>
    <button class="reset" onclick="location.reload()">Reset</button>
  </div>
</div>

<footer>
  Alex estd 2024 | 100% trusted by 10,000+ people
</footer>

<script>
let step=1,service='',price='',quantity='',username='',yt='';
let baseOrderId=23992;

function closePopup(){startPopup.style.display='none'}

function go(n){
  document.getElementById('s'+step).classList.remove('active');
  step=n;
  document.getElementById('s'+step).classList.add('active');
}
function back(){if(step>1)go(step-1)}

function selectService(s){
  service=s;
  qty.innerHTML='';qty.style.display='none';
  instaUser.style.display='none';
  ytLink.style.display='none';
  price='';quantity='';

  if(s==='Instagram Boost'){
    title.innerText='Instagram Boost Details';
    qty.style.display='block';
    instaUser.style.display='block';
    [['100','₹20'],['200','₹30'],['300','₹45'],['400','₹55'],
     ['1000','₹100'],['2000','₹200'],['5000','₹500'],
     ['9000','₹1000'],['10000','₹1100']]
    .forEach(v=>{
      let o=document.createElement('option');
      o.value=v[0]+'|'+v[1];
      o.text=v[0]+' - '+v[1];
      qty.add(o);
    });
  }
  else if(s==='YouTube Subscriber'){
    title.innerText='YouTube Subscriber Details';
    qty.style.display='block';
    ytLink.style.display='block';
    let o=document.createElement('option');
    o.value='1000|₹50';
    o.text='1000 - ₹50';
    qty.add(o);
  }
  else{
    title.innerText='Instagram Account Details';
    instaUser.style.display='block';
    price = s==='Instagram Recovery' ? '₹300' : '₹700';
  }
  go(3);
}

function orderWA(){
  let now=new Date();
  let date=now.toLocaleDateString();
  let time=now.toLocaleTimeString();
  let orderId='#'+(baseOrderId+Math.floor(Math.random()*900));

  let extra='';
  if(instaUser.style.display==='block') extra=`Instagram Username: ${instaUser.value}`;
  if(ytLink.style.display==='block') extra=`YouTube Channel: ${ytLink.value}`;

  if(qty.style.display==='block'){
    let v=qty.value.split('|');
    quantity=v[0];price=v[1];
  }else quantity='N/A';

  let msg=
`Order ID: ${orderId}
Service: ${service}
Quantity: ${quantity}
Amount: ${price}
${extra}
Date: ${date}
Time: ${time}`;

  window.open(
    'https://wa.me/19027088772?text='+encodeURIComponent(msg),
    '_blank'
  );
}
</script>

</body>
</html>
