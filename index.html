<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex Premium Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;}
#loginOverlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:9999;}
.loginBox{background:#fff;width:90%;max-width:360px;padding:28px;border-radius:26px;text-align:center;animation:slideIn .6s ease;position:relative;}
@keyframes slideIn{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}
.backBtn{position:absolute;left:18px;top:18px;font-size:20px;cursor:pointer;display:none;}
.loginBox h2{color:#ff6b6b;margin-bottom:6px;}
.loginBox p{font-size:14px;color:#666;}
.btn{width:100%;padding:14px;border:none;border-radius:16px;margin-top:14px;font-size:16px;cursor:pointer;font-weight:600;}
.google{background:linear-gradient(90deg,#4285F4,#34A853);color:#fff;}
.more{background:linear-gradient(90deg,#667eea,#764ba2);color:#fff;}
.inputField{width:100%;padding:12px;margin-top:10px;border-radius:14px;border:1px solid #ddd;}
.small{font-size:12px;margin-top:10px;color:#666;cursor:pointer;}
.hidden{display:none;}
#site{display:none;width:100%;flex-direction:column;align-items:center;flex:1;}
header{width:100%;padding:14px;background:linear-gradient(90deg,#ff512f,#f09819);display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 15px rgba(0,0,0,.3);}
header div{font-weight:600;font-size:14px;}
header button{padding:6px 12px;border:none;border-radius:14px;background:#fff;color:#333;cursor:pointer;font-weight:600;}
.card{background:#fff;color:#333;padding:30px;border-radius:24px;text-align:center;width:90%;max-width:420px;margin:40px auto;box-shadow:0 20px 40px rgba(0,0,0,.35);position:relative;}
.back{position:absolute;top:15px;left:15px;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ff9f43,#ff6b6b);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold;}
button,select,input{width:100%;padding:14px;margin-top:12px;border:none;border-radius:14px;font-size:16px;}
.main{background:linear-gradient(90deg,#ff512f,#f09819);color:#fff;font-weight:600;}
.service{background:linear-gradient(90deg,#36d1dc,#5b86e5);color:#fff;font-weight:600;}
.reset{background:linear-gradient(90deg,#636e72,#2d3436);color:#fff;}
.wa{position:fixed;right:20px;bottom:80px;width:60px;height:60px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px rgba(0,0,0,.4);z-index:999;}
.wa img{width:34px;}
footer{width:100%;background:linear-gradient(90deg,#141e30,#243b55);padding:14px;text-align:center;font-size:14px;}
</style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="loginOverlay">
  <div class="loginBox">
    <div class="backBtn" id="backBtn" onclick="goBack()">⬅</div>

    <div id="stepMain">
      <h2>👋 Welcome</h2>
      <p>Login to access panel</p>
      <button class="btn google" onclick="googleLogin()">Continue with Google</button>
      <button class="btn more" onclick="showMore()">More options</button>
    </div>

    <div id="stepMore" class="hidden">
      <h2>Select Login</h2>
      <button class="btn more" onclick="showEmail()">Email</button>
      <button class="btn more" onclick="showPhone()">Mobile OTP</button>
    </div>

    <div id="stepEmail" class="hidden">
      <h2>Email Login</h2>
      <input id="email" class="inputField" placeholder="Email">
      <input id="password" type="password" class="inputField" placeholder="Password">
      <button class="btn more" onclick="emailLogin()">Login</button>
      <div class="small" onclick="showSignup()">Don’t have account? Create Account</div>
    </div>

    <div id="stepSignup" class="hidden">
      <h2>Create Account</h2>
      <input id="sEmail" class="inputField" placeholder="Email">
      <input id="sPassword" type="password" class="inputField" placeholder="Password">
      <button class="btn more" onclick="emailSignup()">Sign Up</button>
    </div>

    <div id="stepPhone" class="hidden">
      <h2>Mobile OTP</h2>
      <input value="+91" readonly class="inputField">
      <input id="phoneNum" class="inputField" placeholder="Enter mobile number">
      <button class="btn more" onclick="phoneLogin()">Send OTP</button>
      <input id="otp" class="inputField hidden" placeholder="Enter OTP">
      <button class="btn more hidden" id="verifyOtpBtn" onclick="confirmOtp()">Verify OTP</button>
    </div>
    <div id="recaptcha-container"></div>
  </div>
</div>

<!-- PREMIUM PANEL -->
<div id="site">
  <header>
    <div id="userEmail"></div>
    <button onclick="logout()">Logout</button>
  </header>

  <div id="step1" class="card">
    <h3>Select Service</h3>
    <button class="service" onclick="selectService('Instagram Boost')">Instagram Boost</button>
    <button class="service" onclick="selectService('Instagram Recovery')">Instagram Recovery – ₹300</button>
    <button class="service" onclick="selectService('Instagram Disable')">Instagram Disable – ₹700</button>
    <button class="service" onclick="selectService('YouTube Subscriber')">YouTube Subscriber – ₹50</button>
  </div>

  <div id="step2" class="card hidden">
    <div class="back" onclick="backStep()">⬅</div>
    <h3 id="title"></h3>
    <select id="qty" class="inputField"></select>
    <input id="instaUser" class="inputField hidden" placeholder="Instagram Username">
    <input id="ytLink" class="inputField hidden" placeholder="YouTube Channel Link">
    <button class="main" onclick="goWhatsApp()">Continue to WhatsApp</button>
    <button class="reset" onclick="resetOrder()">Reset</button>
  </div>
</div>

<div class="wa" onclick="goWhatsApp()">
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
</div>

<footer>
Alex estd 2024 | 100% trusted by 10,000+ people
</footer>

<script type="module">
  const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");
const title = document.getElementById("title");
const qty = document.getElementById("qty");
const instaUser = document.getElementById("instaUser");
const ytLink = document.getElementById("ytLink");
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC1DpETrRhKtC48xhh6_GTRot7i8ZFzHAY",
  authDomain: "my-web-de42e.firebaseapp.com",
  projectId: "my-web-de42e",
  storageBucket: "my-web-de42e.firebasestorage.app",
  messagingSenderId: "570214145150",
  appId: "1:570214145150:web:cb7b545ee3de305d5e4c2f",
  measurementId: "G-9LD6JPLFML"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* LOGIN FLOW */
let history=[];
function show(id){document.querySelectorAll(".loginBox > div").forEach(d=>d.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");backBtn.style.display = history.length ? "block":"none"}
window.showMore=()=>{history.push("stepMain");show("stepMore")}
window.showEmail=()=>{history.push("stepMore");show("stepEmail")}
window.showSignup=()=>{history.push("stepEmail");show("stepSignup")}
window.showPhone=()=>{history.push("stepMore");show("stepPhone")}
window.goBack=()=>{const prev=history.pop();show(prev)}
window.googleLogin=()=>signInWithPopup(auth,new GoogleAuthProvider())
window.emailLogin=()=>signInWithEmailAndPassword(auth,email.value,password.value)
window.emailSignup=()=>createUserWithEmailAndPassword(auth,sEmail.value,sPassword.value)
window.logout=()=>signOut(auth);

/* PHONE OTP */
let confirmationResult;
window.phoneLogin=()=>{
  window.recaptchaVerifier = new RecaptchaVerifier('recaptcha-container',{size:'invisible'},auth);
  signInWithPhoneNumber(auth,'+91'+phoneNum.value,window.recaptchaVerifier)
  .then((res)=>{
    confirmationResult=res;
    otp.classList.remove('hidden');
    verifyOtpBtn.classList.remove('hidden');
  }).catch(console.error);
}
window.confirmOtp=()=>{
  confirmationResult.confirm(otp.value).then(res=>{}).catch(e=>alert('Invalid OTP'));
}

/* AUTH STATE */
onAuthStateChanged(auth,user=>{
  if(user){
    loginOverlay.style.display="none";
    site.style.display="flex";
    document.getElementById("userEmail").innerText=user.email||"Google User";
  } else {
    loginOverlay.style.display="flex";
    site.style.display="none";
  }
});

/* ORDER SYSTEM */
let service='',price='',quantity='';
let baseOrderId=23992;
function selectService(s){
  service=s; qty.innerHTML=''; instaUser.classList.add('hidden'); ytLink.classList.add('hidden');
  if(s==='Instagram Boost'){title.innerText='Instagram Boost'; instaUser.classList.remove('hidden');
    let opts=[['100','₹20'],['200','₹30'],['300','₹45'],['400','₹55'],['1000','₹100'],['2000','₹200'],['5000','₹500'],['9000','₹1000'],['10000','₹1100']];
    opts.forEach(v=>{let o=document.createElement('option');o.value=v[0]+'|'+v[1];o.text=v[0]+' - '+v[1];qty.add(o);});
  } else if(s==='YouTube Subscriber'){title.innerText='YouTube Subscriber'; ytLink.classList.remove('hidden'); let o=document.createElement('option');o.value='1000|₹50'; o.text='1000 - ₹50'; qty.add(o);}
  else{title.innerText=s; instaUser.classList.remove('hidden'); qty.style.display='none'; price=s==='Instagram Recovery'?'₹300':'₹700';}
  step1.classList.add('hidden'); step2.classList.remove('hidden');
}
function backStep(){step2.classList.add('hidden'); step1.classList.remove('hidden');}
function resetOrder(){location.reload();}
function goWhatsApp(){
  const now=new Date();
  if(qty.style.display!=='none'){let v=qty.value.split('|'); quantity=v[0]; price=v[1];}else quantity='N/A';
  const extra=instaUser.style.display!=='none'?`Instagram Username: ${instaUser.value}`:ytLink.style.display!=='none'?`YouTube Link: ${ytLink.value}`:'';
  const msg=`Order ID: #${baseOrderId+Math.floor(Math.random()*900)}
Service: ${service}
Quantity: ${quantity}
Amount: ${price}
${extra}
Customer Email: ${auth.currentUser.email}
Date: ${now.toLocaleDateString()}
Time: ${now.toLocaleTimeString()}`;
  window.open('https://wa.me/1902708772?text='+encodeURIComponent(msg),'_blank');
}
</script>
</body>
</html>
