<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premium Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Poppins,system-ui;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;
  overflow:hidden;
}
.hidden{display:none}
.screen{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.card{
  width:90%;
  max-width:420px;
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(18px);
  border-radius:22px;
  padding:26px;
  text-align:center;
  box-shadow:0 25px 50px rgba(0,0,0,.35);
  animation:pop .4s ease;
}
@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}
h2{margin-top:0}
.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  font-size:15px;
  margin-top:12px;
  cursor:pointer;
  color:#fff;
}
.google{background:linear-gradient(90deg,#ff6ec4,#7873f5)}
.primary{background:linear-gradient(90deg,#00c6ff,#0072ff)}
.alt{background:linear-gradient(90deg,#f7971e,#ffd200);color:#000}
.logout{background:#ff4d4d}
input,select{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:none;
  margin-top:10px;
  outline:none;
}
.small{
  font-size:13px;
  opacity:.9;
  cursor:pointer;
}
.topbar{
  position:fixed;
  top:12px;
  left:14px;
  font-size:13px;
}
.logoutBtn{
  position:fixed;
  top:10px;
  right:10px;
}
.footer{
  position:fixed;
  bottom:10px;
  width:100%;
  text-align:center;
  font-size:12px;
  opacity:.85;
}
.wa{
  position:fixed;
  right:18px;
  bottom:70px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:#25D366;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:26px;
}
</style>
</head>

<body>

<div class="topbar" id="emailView"></div>
<button class="btn logout logoutBtn hidden" id="logoutBtn">Logout</button>

<!-- LOGIN -->
<div class="screen" id="loginScreen">
  <div class="card">
    <h2>Welcome 🎉</h2>
    <p>Login to continue</p>

    <button class="btn google" id="googleBtn">Continue with Google</button>

    <hr style="opacity:.3;margin:15px 0">

    <!-- EMAIL LOGIN -->
    <div id="emailLoginBox">
      <input id="loginEmail" placeholder="Email">
      <input id="loginPass" type="password" placeholder="Password">
      <button class="btn primary" id="emailLoginBtn">Login</button>

      <p class="small" id="showSignup">No account? Create account</p>
    </div>

    <!-- SIGNUP -->
    <div id="signupBox" class="hidden">
      <input id="signupEmail" placeholder="Email">
      <input id="signupPass" type="password" placeholder="Password">
      <input id="signupConfirm" type="password" placeholder="Confirm Password">
      <button class="btn alt" id="signupBtn">Create Account</button>

      <p class="small" id="backToLogin">← Back to login</p>
    </div>
  </div>
</div>

<!-- STEP 1 -->
<div class="screen hidden" id="step1">
  <div class="card">
    <h2>Select Service</h2>
    <button class="btn primary" data-service="Instagram Boost">Instagram Boost</button>
    <button class="btn primary" data-service="Instagram Recovery">Instagram Recovery</button>
    <button class="btn primary" data-service="Instagram Disable">Instagram Disable</button>
    <button class="btn primary" data-service="YouTube Subscribers">YouTube Subscribers</button>
  </div>
</div>

<!-- STEP 2 -->
<div class="screen hidden" id="step2">
  <div class="card">
    <h2 id="serviceTitle"></h2>

    <input id="instaUser" class="hidden" placeholder="Instagram Username">
    <input id="ytLink" class="hidden" placeholder="YouTube Channel Link">
    <select id="qty" class="hidden"></select>

    <button class="btn primary" id="continueBtn">Continue</button>
    <button class="btn alt" id="backBtn">← Back</button>
  </div>
</div>

<!-- STEP 3 -->
<div class="screen hidden" id="step3">
  <div class="card">
    <h2>Confirm Order</h2>
    <p id="summary"></p>
    <button class="btn primary" id="waBtn">Purchase on WhatsApp</button>
    <button class="btn alt" id="resetBtn">Reset</button>
  </div>
</div>

<a class="wa" href="https://wa.me/19027088772" target="_blank">💬</a>

<div class="footer">
Alex • Estd 2024<br>
100% trusted by 10000+ people
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
 getAuth, GoogleAuthProvider, signInWithPopup,
 signInWithEmailAndPassword, createUserWithEmailAndPassword,
 onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyC1DpETrRhKtC48xhh6_GTRot7i8ZFzHAY",
 authDomain: "my-web-de42e.firebaseapp.com",
 projectId: "my-web-de42e",
 appId: "1:570214145150:web:cb7b545ee3de305d5e4c2f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let service="", quantity="", amount="", extra="";

/* LOGIN */
googleBtn.onclick=()=>signInWithPopup(auth,provider);
emailLoginBtn.onclick=()=>signInWithEmailAndPassword(auth,loginEmail.value,loginPass.value);
signupBtn.onclick=()=>{
 if(signupPass.value!==signupConfirm.value){alert("Passwords do not match");return;}
 createUserWithEmailAndPassword(auth,signupEmail.value,signupPass.value);
};
showSignup.onclick=()=>{
 emailLoginBox.classList.add("hidden");
 signupBox.classList.remove("hidden");
};
backToLogin.onclick=()=>{
 signupBox.classList.add("hidden");
 emailLoginBox.classList.remove("hidden");
};

/* AUTH STATE */
onAuthStateChanged(auth,user=>{
 if(user){
  emailView.innerText=user.email;
  logoutBtn.classList.remove("hidden");
  loginScreen.classList.add("hidden");
  step1.classList.remove("hidden");
 }else{
  location.reload();
 }
});

/* LOGOUT */
logoutBtn.onclick=()=>signOut(auth);

/* SERVICES */
document.querySelectorAll("[data-service]").forEach(btn=>{
 btn.onclick=()=>{
  service=btn.dataset.service;
  step1.classList.add("hidden");
  step2.classList.remove("hidden");

  serviceTitle.innerText=service;
  instaUser.classList.add("hidden");
  ytLink.classList.add("hidden");
  qty.classList.add("hidden");
  qty.innerHTML="";

  if(service==="Instagram Boost"){
   instaUser.classList.remove("hidden");
   qty.classList.remove("hidden");
   [["100","20"],["200","30"],["300","45"],["400","55"],["1000","100"],["2000","200"],["5000","500"],["9000","1000"],["10000","1100"]]
   .forEach(v=>{
    let o=document.createElement("option");
    o.value=v[0]+"|"+v[1];
    o.text=`${v[0]} - ₹${v[1]}`;
    qty.add(o);
   });
  }
  if(service==="Instagram Recovery"){instaUser.classList.remove("hidden");amount="300";}
  if(service==="Instagram Disable"){instaUser.classList.remove("hidden");amount="700";}
  if(service==="YouTube Subscribers"){
   ytLink.classList.remove("hidden");
   let o=document.createElement("option");
   o.value="1000|50";o.text="1000 - ₹50";
   qty.add(o);qty.classList.remove("hidden");
  }
 };
});

continueBtn.onclick=()=>{
 if(qty.value){[quantity,amount]=qty.value.split("|")}
 extra=instaUser.value||ytLink.value;
 summary.innerHTML=`Service: ${service}<br>Qty: ${quantity||"N/A"}<br>Amount: ₹${amount}<br>Info: ${extra}`;
 step2.classList.add("hidden");
 step3.classList.remove("hidden");
};

backBtn.onclick=()=>{step2.classList.add("hidden");step1.classList.remove("hidden")};
resetBtn.onclick=()=>location.reload();

waBtn.onclick=()=>{
 const id=23992+Math.floor(Math.random()*900);
 const msg=`Order ID: #${id}
Service: ${service}
Quantity: ${quantity||"N/A"}
Amount: ₹${amount}
Info: ${extra}
Email: ${auth.currentUser.email}
Date: ${new Date().toLocaleString()}`;
 window.open("https://wa.me/19027088772?text="+encodeURIComponent(msg));
};
</script>
</body>
</html>
