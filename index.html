<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESERVICE | WhatsApp Order</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;color:#fff;overflow:hidden}

/* ===== OVERLAY + POPUP ===== */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  animation:fade .5s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}

.popup{
  background:#fff;
  color:#333;
  padding:28px;
  border-radius:22px;
  width:90%;
  max-width:380px;
  text-align:center;
  animation:pop .6s ease;
}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

.popup h3{margin-bottom:10px}
.popup button{
  margin-top:15px;
  padding:12px;
  width:100%;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,#ff512f,#f09819);
  color:#fff;
  font-weight:600;
}

/* ===== STEPS ===== */
.step{display:none;align-items:center;justify-content:center;height:100vh;animation:slide .6s ease}
.step.active{display:flex}
@keyframes slide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* ===== CARD ===== */
.card{
  background:#fff;
  color:#333;
  width:90%;
  max-width:420px;
  padding:30px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,.35);
  position:relative;
}
.back{
  position:absolute;top:15px;left:15px;
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,#ff9f43,#ff6b6b);
  color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer
}

button,select,input{
  width:100%;padding:14px;margin-top:12px;
  border:none;border-radius:14px;font-size:16px
}
.main{background:linear-gradient(90deg,#ff512f,#f09819);color:#fff;font-weight:600}
.service{background:linear-gradient(90deg,#36d1dc,#5b86e5);color:#fff;font-weight:600}
.whatsapp{background:linear-gradient(90deg,#25d366,#128c7e);color:#fff;font-weight:700}
.reset{background:linear-gradient(90deg,#636e72,#2d3436);color:#fff}

/* ===== FLOATING WA OVERLAY ===== */
.wa{
  position:fixed;right:20px;bottom:80px;
  width:60px;height:60px;border-radius:50%;
  background:#25d366;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 25px rgba(0,0,0,.4);z-index:999
}
.wa img{width:34px}

/* ===== FOOTER ===== */
footer{
  position:fixed;bottom:0;width:100%;
  background:linear-gradient(90deg,#141e30,#243b55);
  padding:14px;text-align:center;font-size:14px
}
</style>
</head>

<body>

<!-- OVERLAY POPUP -->
<div class="overlay" id="startPopup">
  <div class="popup">
    <h3>🚀 Website Developed</h3>
    <p>By <b>Alex Team</b><br>100% Trusted Platform</p>
    <button onclick="closePopup()">Continue</button>
  </div>
</div>

<!-- STEP 1 -->
<div class="step active" id="s1">
  <div class="card">
    <h2>Welcome to ESERVICE</h2>
    <p>Secure & Trusted WhatsApp Ordering</p>
    <button class="main" onclick="go(2)">Select Service</button>
  </div>
</div>

<!-- STEP 2 -->
<div class="step" id="s2">
  <div class="card">
    <div class="back" onclick="back()">⬅</div>
    <h3>Select Service</h3>
    <button class="service" onclick="selectService('Instagram Boost')">Instagram Boost</button>
    <button class="service" onclick="selectService('Instagram Recovery')">Instagram Recovery – ₹300</button>
    <button class="service" onclick="selectService('Instagram Disable')">Instagram Disable – ₹700</button>
    <button class="service" onclick="selectService('YouTube Subscriber')">YouTube Subscriber – ₹50</button>
  </div>
</div>

<!-- STEP 3 -->
<div class="step" id="s3">
  <div class="card">
    <div class="back" onclick="back()">⬅</div>
    <h3 id="title"></h3>
    <select id="qty"></select>
    <input id="username" placeholder="Enter Username">
    <button class="main" onclick="go(4)">Next</button>
  </div>
</div>

<!-- STEP 4 -->
<div class="step" id="s4">
  <div class="card">
    <div class="back" onclick="back()">⬅</div>
    <h3>Continue on WhatsApp</h3>
    <button class="whatsapp" onclick="orderWA()">Proceed</button>
    <button class="reset" onclick="location.reload()">Reset</button>
  </div>
</div>

<!-- FLOATING WHATSAPP -->
<div class="wa" onclick="orderWA()">
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
</div>

<footer>
  Alex estd 2024 | 100% trusted by 10,000+ people
</footer>

<script>
let step=1,service='',price='',quantity='';
let baseOrderId=23992;

function closePopup(){
  document.getElementById('startPopup').style.display='none';
}

function go(n){
  document.getElementById('s'+step).classList.remove('active');
  step=n;
  document.getElementById('s'+step).classList.add('active');
}
function back(){if(step>1)go(step-1)}

function selectService(s){
  service=s;
  qty.innerHTML='';qty.style.display='none';
  username.style.display='none';price='';
  if(s==='Instagram Boost'){
    title.innerText='Select Quantity';
    qty.style.display='block';
    [['100','₹20'],['200','₹30'],['300','₹45'],['400','₹55'],['1000','₹100'],['2000','₹200'],['5000','₹500'],['9000','₹1000'],['10000','₹1100']]
    .forEach(v=>{
      let o=document.createElement('option');
      o.value=v[0]+'|'+v[1];o.text=v[0]+' - '+v[1];qty.add(o);
    });
  }else if(s==='YouTube Subscriber'){
    title.innerText='YouTube Subscribers';
    qty.style.display='block';
    let o=document.createElement('option');
    o.value='1000|₹50';o.text='1000 - ₹50';qty.add(o);
  }else{
    title.innerText='Enter Username';
    username.style.display='block';
    price=s==='Instagram Recovery'?'₹300':'₹700';
  }
  go(3);
}

function orderWA(){
  let now=new Date();
  let date=now.toLocaleDateString();
  let time=now.toLocaleTimeString();
  let orderId='#'+(baseOrderId+Math.floor(Math.random()*900));
  if(qty.style.display==='block'){
    let v=qty.value.split('|');quantity=v[0];price=v[1];
  }else quantity='N/A';
  let msg=
`Order ID: ${orderId}
Service: ${service}
Quantity: ${quantity}
Amount: ${price}
Date: ${date}
Time: ${time}`;
  window.open('https://wa.me/19027088772?text='+encodeURIComponent(msg),'_blank');
}
</script>

</body>
  </html>
