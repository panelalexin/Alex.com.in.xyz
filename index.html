<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Login | Alex Team</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  min-height:100vh;
  overflow:hidden;
}

/* ===== OVERLAY ===== */
#loginOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

/* ===== LOGIN CARD ===== */
.loginBox{
  background:#fff;
  width:90%;
  max-width:360px;
  padding:26px;
  border-radius:26px;
  text-align:center;
  animation:slideIn .6s ease;
  position:relative;
}
@keyframes slideIn{
  from{transform:translateY(80px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.backBtn{
  position:absolute;
  left:18px;
  top:18px;
  font-size:20px;
  cursor:pointer;
  display:none;
}

.loginBox h2{color:#ff6b6b;margin-bottom:6px}
.loginBox p{font-size:14px;color:#666}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  margin-top:14px;
  font-size:16px;
  cursor:pointer;
  font-weight:600;
}

.google{
  background:linear-gradient(90deg,#4285F4,#34A853);
  color:#fff;
}

.more{
  background:linear-gradient(90deg,#667eea,#764ba2);
  color:#fff;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:14px;
  border:1px solid #ddd;
}

.small{
  font-size:12px;
  margin-top:10px;
  color:#666;
  cursor:pointer;
}

.hidden{display:none}

/* ===== MAIN SITE ===== */
#site{
  display:none;
  min-height:100vh;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  background:#fff;
  color:#333;
  padding:30px;
  border-radius:24px;
  text-align:center;
  width:90%;
  max-width:400px;
}
</style>
</head>

<body>

<div id="loginOverlay">
  <div class="loginBox">

    <div class="backBtn" id="backBtn" onclick="goBack()">⬅</div>

    <!-- STEP 1 -->
    <div id="stepMain">
      <h2>👋 Welcome</h2>
      <p>Login to continue</p>

      <button class="btn google" onclick="googleLogin()">Continue with Google</button>
      <button class="btn more" onclick="showMore()">More options</button>
    </div>

    <!-- STEP 2 -->
    <div id="stepMore" class="hidden">
      <h2>Choose Method</h2>
      <button class="btn more" onclick="showEmail()">Email</button>
      <button class="btn more" onclick="showPhone()">Mobile OTP</button>
    </div>

    <!-- STEP 3 EMAIL -->
    <div id="stepEmail" class="hidden">
      <h2>Email Login</h2>
      <input id="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <button class="btn more" onclick="emailLogin()">Login</button>

      <div class="small" onclick="showSignup()">
        Don’t have an account? <b>Create account</b>
      </div>
    </div>

    <!-- STEP 4 EMAIL SIGNUP -->
    <div id="stepSignup" class="hidden">
      <h2>Create Account</h2>
      <input id="sEmail" placeholder="Email">
      <input id="sPassword" type="password" placeholder="Password">
      <button class="btn more" onclick="emailSignup()">Sign Up</button>
    </div>

    <!-- STEP 3 PHONE -->
    <div id="stepPhone" class="hidden">
      <h2>Mobile OTP</h2>
      <input id="phone" value="+91" readonly>
      <input id="phoneNum" placeholder="Enter mobile number">
      <button class="btn more" onclick="phoneLogin()">Send OTP</button>
    </div>

  </div>
</div>

<div id="site">
  <div class="card">
    <h2>✅ Access Granted</h2>
    <p>Welcome to Alex Services</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signInWithPhoneNumber,
  RecaptchaVerifier,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC1DpETrRhKtC48xhh6_GTRot7i8ZFzHAY",
  authDomain: "my-web-de42e.firebaseapp.com",
  projectId: "my-web-de42e",
  storageBucket: "my-web-de42e.firebasestorage.app",
  messagingSenderId: "570214145150",
  appId: "1:570214145150:web:cb7b545ee3de305d5e4c2f",
  measurementId: "G-9LD6JPLFML"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let history=[];

function show(id){
  document.querySelectorAll(".loginBox > div").forEach(d=>d.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  backBtn.style.display = history.length ? "block":"none";
}

window.showMore=()=>{history.push("stepMain");show("stepMore")}
window.showEmail=()=>{history.push("stepMore");show("stepEmail")}
window.showSignup=()=>{history.push("stepEmail");show("stepSignup")}
window.showPhone=()=>{history.push("stepMore");show("stepPhone")}

window.goBack=()=>{
  const prev = history.pop();
  show(prev);
}

window.googleLogin=()=>{
  signInWithPopup(auth,new GoogleAuthProvider());
}

window.emailLogin=()=>{
  signInWithEmailAndPassword(auth,email.value,password.value);
}

window.emailSignup=()=>{
  createUserWithEmailAndPassword(auth,sEmail.value,sPassword.value);
}

window.phoneLogin=()=>{
  window.recaptchaVerifier=new RecaptchaVerifier(auth,"loginOverlay",{size:"invisible"});
  signInWithPhoneNumber(auth,"+91"+phoneNum.value,recaptchaVerifier)
  .then(r=>{
    const code=prompt("Enter OTP");
    r.confirm(code);
  });
}

onAuthStateChanged(auth,u=>{
  if(u){
    loginOverlay.style.display="none";
    site.style.display="flex";
  }
});
</script>

</body>
</html>
